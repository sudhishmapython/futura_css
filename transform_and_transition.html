<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .square {
  background: rgb(10, 138, 44);
  border-radius: 5px;
  height: 50px;
  margin: 100px;
  transition: transform 3s;
  width: 50px;
  
}
div:hover {
    transform: rotate(90deg) scale(1.9) translateX(90px);
  }


    </style>
</head>
<body>
    <div class="square"></div>
</body>
</html>
