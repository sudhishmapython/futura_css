<!-- or -->


<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    .center-absolute {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: lightcoral;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="center-absolute">
    I'm also perfectly centered!
  </div>
</body>
</html>
