    <style>
        div{
            width:250px;
            height: 250px;
            background-color: chartreuse;
            position: relative;


              /* animation-name: move;              
             animation-duration: 4s;              */

            animation-direction:alternate;                  */
                  /* reverse,alternate */
            /* animation-timing-function: ease-in;  */
                /* linear,ease-in ,ease-out*/



                /* shorthand */
                animation: move 4s  ;
           
        }
    
        @keyframes move{
           0%{
                left: 0px;
                top: 0px;
                
               }
   
            50%
            {
                left: 300px;
                top: 100px;
                border-radius:150px ;
            }
            100%{
            left: 600px;
            top:60px;
            border-radius:150px ;
          

            }
        }
    </style>
</head>
