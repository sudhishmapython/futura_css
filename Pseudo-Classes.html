<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        button {
            background-color: lightblue;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

         input {
            padding: 5px;
            border: 2px solid gray;
        }

        /* hover */

        button:hover {
            background-color: darkblue;
            color: white;
        }

        /* focus */

       
        input:focus {
            border-color: blue;
            background-color: rgb(9, 221, 150);
        }
        /* active */

        button:active {
    background-color: rgb(0, 139, 46);
}

/* unvisited link */
a:link {
  color: red;
}

/* visited link */
a:visited {
  color: green;
}

/* first child */

/* li:last-child{
            color: red;
            font-weight: bold;
        } */
        /* last child  */
        li:nth-child(even)
        {
            color: yellow;
        }
    </style>
</head>
<body>
    <!-- hover -->
    <button>Hover over me!</button>
    <br>
    <!-- focus -->
    <input type="text" placeholder="Click to focus">


 <a href="transform.html" target="_blank">This is a link</a>

    <!-- first child -->


    <ul>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
         <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>
</body>
</html>
